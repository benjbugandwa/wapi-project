# nixpacks.toml - Configuration Railway / Nixpacks optimisée pour Wapi
providers = ["php", "node"]

[variables]
NIXPACKS_PHP_ROOT_DIR = "/app/public"
NIXPACKS_NODE_VERSION = "20"

[phases.build]
cmds = [
    "npm run build",
    "php artisan package:discover --ansi"
]

[start]
cmd = "bash scripts/railway-start.sh"
