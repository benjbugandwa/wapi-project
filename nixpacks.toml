# nixpacks.toml - Configuration Railway / Nixpacks optimisée pour Wapi
providers = ["php"]

[phases.setup]
nixPkgs = [
    "...",
    "nodejs_20"
]
nixOverlays = []

[variables]
NIXPACKS_PHP_ROOT_DIR = "/app/public"

[phases.install]
cmds = [
    "composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction",
    "npm ci"
]

[phases.build]
cmds = [
    "npm run build",
    "php artisan package:discover --ansi"
]

[start]
cmd = "bash scripts/railway-start.sh"

